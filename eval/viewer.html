<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프롬프트 평가 뷰어</title>
<style>
  :root {
    color-scheme: light dark;
    --bg:#fbfcfe; --fg:#1c2530; --muted:#6b7684; --line:#e6ebf2; --line2:#d7dee8;
    --panel:rgba(127,127,127,.04); --th:#eef2f7; --link:#2f6fdb;
    --err:#d64545; --errbg:#fdecec; --warn:#b5730a; --warnbg:#fbf1de; --ok:#1f9d55; --okbg:#e7f6ec;
    --code:#eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#12161c; --fg:#dfe6ee; --muted:#8a94a1; --line:#232c37; --line2:#2c3542;
      --panel:rgba(255,255,255,.03); --th:#1a2029; --link:#6ea8fe;
      --errbg:#3a1e1e; --warnbg:#3a2f18; --okbg:#183026; --code:#1a2029;
    }
  }
  * { box-sizing:border-box; }
  body { font-family:'Segoe UI','Malgun Gothic',system-ui,sans-serif; margin:0; padding:24px; line-height:1.55; background:var(--bg); color:var(--fg); }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:20px; }
  .controls { display:flex; gap:16px; flex-wrap:wrap; align-items:center; margin-bottom:16px; font-size:13px; }
  select, input[type=file] { font:inherit; padding:4px 6px; }
  section { margin-bottom:28px; }
  h2 { font-size:15px; margin:0 0 10px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; }
  .card { border:1px solid var(--line2); border-radius:10px; padding:12px 14px; background:var(--panel); }
  .card .hash { font-family:ui-monospace,monospace; font-size:12px; color:var(--muted); }
  .card .acc { font-size:24px; font-weight:700; margin:4px 0; }
  .card .meta { font-size:12px; color:var(--muted); }
  .table-wrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { cursor:pointer; user-select:none; position:sticky; top:0; background:var(--th); }
  th.nosort { cursor:default; }
  tbody tr { cursor:pointer; }
  tbody tr:hover { background:var(--panel); }
  td.mono { font-family:ui-monospace,monospace; font-size:12px; }
  .ok { color:var(--ok); font-weight:700; } .no { color:var(--err); font-weight:700; } .dash { color:var(--muted); }
  .empty { color:var(--muted); padding:40px 0; text-align:center; }
  .cmpbar { position:sticky; bottom:0; background:var(--bg); padding:10px 0; }
  button.act { font:inherit; padding:6px 14px; border:1px solid var(--line2); border-radius:8px; background:var(--panel); color:var(--fg); cursor:pointer; }
  button.act:disabled { opacity:.4; cursor:default; }

  /* ---- 리포트 렌더 (프론트 report-detail 구조 참고) ---- */
  .sev-badge { display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:6px; }
  .sev-HIGH { background:var(--errbg); color:var(--err); } .sev-MID { background:var(--warnbg); color:var(--warn); } .sev-LOW { background:var(--okbg); color:var(--ok); }
  .rpt-title { font-size:16px; font-weight:700; margin:8px 0 2px; }
  .rpt-title .svc { color:var(--link); }
  .seclabel { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin:14px 0 6px; }
  .rca-key { font-size:12px; font-weight:700; color:var(--muted); }
  .rca-val { margin:2px 0 10px; }
  .chain { list-style:none; margin:2px 0 6px; padding:0; }
  .chain li { position:relative; padding:0 0 6px 16px; font-size:13px; }
  .chain li::before { content:""; position:absolute; left:3px; top:6px; width:7px; height:7px; border-radius:50%; background:var(--link); }
  .chain li:not(:last-child)::after { content:""; position:absolute; left:6px; top:10px; bottom:0; width:1px; background:var(--line2); }
  .chip { display:inline-block; font-size:12px; padding:2px 8px; margin:0 4px 4px 0; border-radius:12px; background:var(--panel); border:1px solid var(--line2); }
  .tag { display:inline-block; font-size:12px; padding:2px 8px; margin:0 4px 4px 0; border-radius:6px; }
  .tag-err { background:var(--errbg); color:var(--err); } .tag-neu { background:var(--panel); color:var(--muted); border:1px solid var(--line2); }
  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin:14px 0 12px; }
  .tab { font:inherit; font-size:13px; padding:6px 12px; border:none; background:none; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tab.on { color:var(--fg); border-bottom-color:var(--link); font-weight:700; }
  .subtabs { display:flex; gap:4px; margin:0 0 8px; }
  .subtab { font:inherit; font-size:12px; padding:4px 10px; border:1px solid var(--line2); border-radius:14px; background:var(--panel); color:var(--muted); cursor:pointer; }
  .subtab.on { color:var(--fg); border-color:var(--link); font-weight:700; }
  code { background:var(--code); padding:1px 5px; border-radius:4px; font-size:.9em; }
  .note { font-size:12px; color:var(--muted); font-style:italic; margin:8px 0; }
  .kv { font-size:13px; margin:4px 0; } .kv b { color:var(--muted); font-weight:700; margin-right:6px; }

  /* ---- 오버레이 ---- */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; z-index:50; padding:24px; overflow:auto; }
  .overlay.on { display:block; }
  .modal { max-width:820px; margin:0 auto; background:var(--bg); border:1px solid var(--line2); border-radius:12px; padding:22px; }
  .modal.wide { max-width:1200px; }
  .modal-x { float:right; font-size:20px; border:none; background:none; color:var(--muted); cursor:pointer; line-height:1; }
  .cmpgrid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .cmpcol { border:1px solid var(--line); border-radius:10px; padding:14px; min-width:0; }
  .cmpcol h3 { font-size:13px; margin:0 0 8px; font-family:ui-monospace,monospace; color:var(--muted); }
</style>
</head>
<body>
<h1>프롬프트 평가 뷰어</h1>
<div class="sub">
  <code>eval/index.csv</code> 를 읽어 표시 · set_hash별 정답률로 프롬프트 버전 비교 · 행 클릭=상세, 체크 2개=비교.
  (파일에서 열면 fetch가 막힘 — <code>python -m http.server</code> 로 서빙 권장. 상세/비교는 서빙 시에만.)
</div>

<div class="controls">
  <span>시나리오 <select id="f-scenario"><option value="">전체</option></select></span>
  <span>정답 <select id="f-correct"><option value="">전체</option><option value="O">O</option><option value="X">X</option><option value="-">미채점</option></select></span>
  <span>CSV 직접 선택 <input type="file" id="file" accept=".csv"></span>
</div>

<section id="summary-section" hidden>
  <h2>버전별(set_hash) 요약</h2>
  <div class="cards" id="cards"></div>
</section>

<section>
  <h2>실행 기록</h2>
  <div class="table-wrap"><table id="table"><thead></thead><tbody></tbody></table></div>
  <div class="empty" id="empty">데이터 없음 — index.csv 를 불러오지 못했습니다.</div>
  <div class="cmpbar"><button class="act" id="cmp-btn" disabled>선택한 2개 비교</button> <span id="cmp-hint" style="color:var(--muted);font-size:12px"></span></div>
</section>

<div class="overlay" id="ov-detail"><div class="modal"><button class="modal-x" data-close>×</button><div id="detail-body"></div></div></div>
<div class="overlay" id="ov-compare"><div class="modal wide"><button class="modal-x" data-close>×</button><h2>2-run 비교</h2><div class="cmpgrid" id="compare-body"></div></div></div>

<script>
const COLS = ["ts","scenario","set_hash","report_model","pred_type","pred_service","pred_severity","correct","latency_s","runs_path"];
let rows = [], sortKey = "ts", sortDir = -1;
const checked = new Set();

// ---------- CSV ----------
function parseCSV(text){
  const out=[]; let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else { if(c==='"')q=true; else if(c===','){row.push(f);f="";} else if(c==='\r'){} else if(c==='\n'){row.push(f);out.push(row);row=[];f="";} else f+=c; }
  }
  if(f.length||row.length){row.push(f);out.push(row);}
  return out.filter(r=>r.length>1||(r.length===1&&r[0]!==""));
}
function load(text){
  const t=parseCSV(text);
  if(!t.length){rows=[];render();return;}
  const h=t[0];
  rows=t.slice(1).map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]??""])));
  const scs=[...new Set(rows.map(r=>r.scenario))].sort();
  document.getElementById("f-scenario").innerHTML='<option value="">전체</option>'+scs.map(s=>`<option>${s}</option>`).join("");
  render();
}
function filtered(){
  const sc=document.getElementById("f-scenario").value, co=document.getElementById("f-correct").value;
  return rows.filter(r=>(!sc||r.scenario===sc)&&(!co||(r.correct||"-")===co));
}

// ---------- helpers ----------
const esc=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const code=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>");   // backtick → <code>
const sevBadge=s=>`<span class="sev-badge sev-${esc(s)||'MID'}">${esc(s)||'—'}</span>`;
function chain(text){
  const steps=String(text||"").split(/\s*(?:→|->)\s*/).filter(Boolean);
  return `<ul class="chain">${steps.map(s=>`<li>${code(s)}</li>`).join("")}</ul>`;
}
function runPath(r){ return String(r.runs_path||"").replace(/\\/g,"/"); }
async function fetchResult(r){
  const res=await fetch(runPath(r)+"/result.json");
  if(!res.ok) throw new Error("result.json fetch 실패 ("+res.status+")");
  return res.json();
}

// ---------- 리포트 렌더 ----------
function reportHeader(res){
  return `<div>${sevBadge(res.severity)} <span class="rpt-title">[${esc(res.type)}] <span class="svc">${esc(res.service)}</span></span></div>`;
}
function rcaBlock(d){
  const rca=d.rca||{};
  return `<div class="seclabel">종합 에이전트 RCA 결론${rca.confidence!=null?` · 확신도 ${esc(rca.confidence)}`:""}</div>
    <div class="rca-key">근본 원인</div><div class="rca-val">${code(rca.rootCause)}</div>
    <div class="rca-key">전파 경로</div>${chain(rca.propagation)}`;
}
function tabSummary(d){
  const s=d.summary||{};
  const chips=(s.chips||[]).map(c=>`<span class="chip">${esc(c)}</span>`).join("");
  const et=(s.errorTags||[]).map(t=>`<span class="tag tag-err">${esc(t)}</span>`).join("");
  const nt=(s.neutralTags||[]).map(t=>`<span class="tag tag-neu">${esc(t)}</span>`).join("");
  return `<div class="rca-val">${code(s.highlight)}</div>
    ${chips?`<div class="seclabel">감지 신호</div><div>${chips}</div>`:""}
    ${(et||nt)?`<div class="seclabel">연루 서비스/태그</div><div>${et}${nt}</div>`:""}`;
}
function tabCause(d, active){
  const ev=d.evidence||{}; const order=["log","trace","metric"]; const L={log:"Log Agent",trace:"Trace Agent",metric:"Metric Agent"};
  const subtabs=order.map(a=>`<button class="subtab${a===active?' on':''}" data-sub="${a}">${L[a]}</button>`).join("");
  const e=ev[active]||{};
  return `<div class="subtabs">${subtabs}</div>
    <div class="kv"><b>출처</b>${esc(e.source)||"—"}</div>
    <div class="kv"><b>분석 결론</b></div><div class="rca-val">${code(e.conclusion)}</div>
    ${active==="trace"&&e.originService?`<div class="kv"><b>origin_service</b><code>${esc(e.originService)}</code></div>`:""}
    <div class="note">※ 원문 lines/spans/items 는 제품에서 Spring이 DB raw로 조립하는 부분 — AI 출력엔 결론·출처만 있음.</div>`;
}
function tabImpact(d){
  const af=(d.impact&&d.impact.affected)||[];
  if(!af.length) return `<div class="note">affected 없음.</div>`;
  return af.map(a=>`<div class="kv"><b>${esc(a.service)}</b>${a.errors!=null?`errors=${esc(a.errors)}`:""}${a.type?` · ${esc(a.type)}`:""}</div>`).join("");
}
function tabAction(d){
  const st=(d.actions&&d.actions.steps)||[];
  return (st.length?`<ol>${st.map(s=>`<li>${code(s)}</li>`).join("")}</ol>`:`<div class="note">steps 없음.</div>`)
    +(d.actions&&d.actions.recovery?`<div class="seclabel">복구</div><div class="rca-val">${code(d.actions.recovery)}</div>`:"");
}
const TABS=[["요약",tabSummary],["원인",tabCause],["영향",tabImpact],["조치",tabAction]];
function renderDetail(res){
  const d=res.detail||{};
  const el=document.getElementById("detail-body");
  let tab=0, sub="log";
  function paint(){
    const [,fn]=TABS[tab];
    el.innerHTML=reportHeader(res)+rcaBlock(d)
      +`<div class="tabs">${TABS.map((t,i)=>`<button class="tab${i===tab?' on':''}" data-tab="${i}">${t[0]}</button>`).join("")}</div>`
      +`<div id="tabpanel">${tab===1?fn(d,sub):fn(d)}</div>`;
    el.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=+b.dataset.tab;paint();});
    el.querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>{sub=b.dataset.sub;paint();});
  }
  paint();
}
function reportCompact(res){   // 비교용 — 탭 없이 핵심 섹션 스택
  const d=res.detail||{}, ev=d.evidence||{};
  const evc=["log","trace","metric"].map(a=>`<div class="kv"><b>${a}</b>${code((ev[a]||{}).conclusion)}</div>`).join("");
  return reportHeader(res)+rcaBlock(d)
    +`<div class="seclabel">요약</div><div class="rca-val">${code((d.summary||{}).highlight)}</div>`
    +`<div class="seclabel">근거 결론</div>${evc}`
    +`<div class="seclabel">조치</div>${tabAction(d)}`;
}

// ---------- 오버레이 ----------
function openDetail(r){
  const ov=document.getElementById("ov-detail");
  document.getElementById("detail-body").innerHTML='<div class="note">로딩 중…</div>';
  ov.classList.add("on");
  fetchResult(r).then(renderDetail).catch(e=>{document.getElementById("detail-body").innerHTML=`<div class="note">${esc(e.message)} — http.server 로 서빙했는지 확인.</div>`;});
}
function openCompare(){
  const list=[...checked]; if(list.length!==2) return;
  const ov=document.getElementById("ov-compare"), body=document.getElementById("compare-body");
  body.innerHTML='<div class="note">로딩 중…</div>'; ov.classList.add("on");
  Promise.all(list.map(i=>fetchResult(rows[i]))).then(([a,b])=>{
    body.innerHTML=`<div class="cmpcol"><h3>${esc(rows[list[0]].scenario)} · ${esc(rows[list[0]].set_hash)}</h3>${reportCompact(a)}</div>
      <div class="cmpcol"><h3>${esc(rows[list[1]].scenario)} · ${esc(rows[list[1]].set_hash)}</h3>${reportCompact(b)}</div>`;
  }).catch(e=>{body.innerHTML=`<div class="note">${esc(e.message)}</div>`;});
}
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>b.closest(".overlay").classList.remove("on"));
document.querySelectorAll(".overlay").forEach(o=>o.onclick=e=>{if(e.target===o)o.classList.remove("on");});

// ---------- summary + table ----------
function renderSummary(data){
  const g={}; for(const r of data){(g[r.set_hash||"?"]||=[]).push(r);}
  document.getElementById("cards").innerHTML=Object.entries(g).map(([h,rs])=>{
    const sc=rs.filter(r=>r.correct==="O"||r.correct==="X"), ok=rs.filter(r=>r.correct==="O").length;
    const acc=sc.length?Math.round(100*ok/sc.length):null;
    const lat=rs.map(r=>parseFloat(r.latency_s)).filter(x=>!isNaN(x));
    const avg=lat.length?(lat.reduce((a,b)=>a+b,0)/lat.length).toFixed(1):"–";
    return `<div class="card"><div class="hash">${esc(h)}</div><div class="acc">${acc==null?"–":acc+"%"}</div><div class="meta">정답 ${ok}/${sc.length} · 실행 ${rs.length}회 · 평균 ${avg}s</div></div>`;
  }).join("");
  document.getElementById("summary-section").hidden=data.length===0;
}
function td(r,k){
  const v=r[k]??"";
  if(k==="correct") return v==="O"?'<td class="ok">O</td>':v==="X"?'<td class="no">X</td>':'<td class="dash">–</td>';
  if(k==="set_hash"||k==="runs_path") return `<td class="mono">${esc(v)}</td>`;
  return `<td>${esc(v)}</td>`;
}
function render(){
  const data=filtered(); renderSummary(data);
  const thead=document.querySelector("#table thead"), tbody=document.querySelector("#table tbody");
  document.getElementById("empty").hidden=data.length>0;
  if(!data.length){thead.innerHTML="";tbody.innerHTML="";return;}
  data.sort((a,b)=>{let x=a[sortKey]??"",y=b[sortKey]??"";const nx=parseFloat(x),ny=parseFloat(y);if(!isNaN(nx)&&!isNaN(ny)){x=nx;y=ny;}return x<y?-sortDir:x>y?sortDir:0;});
  thead.innerHTML="<tr><th class='nosort'></th>"+COLS.map(c=>`<th data-k="${c}">${c}${c===sortKey?(sortDir<0?" ▾":" ▴"):""}</th>`).join("")+"</tr>";
  thead.querySelectorAll("th[data-k]").forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(k===sortKey)sortDir=-sortDir;else{sortKey=k;sortDir=1;}render();});
  tbody.innerHTML=data.map(r=>{
    const idx=rows.indexOf(r);
    return `<tr data-idx="${idx}"><td><input type="checkbox" data-chk="${idx}" ${checked.has(idx)?"checked":""}></td>${COLS.map(c=>td(r,c)).join("")}</tr>`;
  }).join("");
  tbody.querySelectorAll("tr").forEach(tr=>{
    tr.onclick=e=>{ if(e.target.matches("[data-chk]")) return; openDetail(rows[+tr.dataset.idx]); };
  });
  tbody.querySelectorAll("[data-chk]").forEach(cb=>cb.onclick=e=>{
    e.stopPropagation(); const i=+cb.dataset.chk;
    if(cb.checked)checked.add(i); else checked.delete(i);
    updateCmp();
  });
  updateCmp();
}
function updateCmp(){
  const n=checked.size, btn=document.getElementById("cmp-btn");
  btn.disabled=n!==2;
  document.getElementById("cmp-hint").textContent=n===0?"":`${n}개 선택${n>2?" (2개만 비교 가능)":""}`;
}

document.getElementById("f-scenario").onchange=render;
document.getElementById("f-correct").onchange=render;
document.getElementById("cmp-btn").onclick=openCompare;
document.getElementById("file").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>load(rd.result);rd.readAsText(f,"utf-8");};
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelectorAll(".overlay.on").forEach(o=>o.classList.remove("on"));});

fetch("index.csv").then(r=>r.ok?r.text():Promise.reject()).then(load).catch(()=>{});
</script>
</body>
</html>
